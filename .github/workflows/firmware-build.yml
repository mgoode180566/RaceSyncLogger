name: Build both RaceSync boards
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lap-timer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic src/laptiming/LapTimer.cpp src/laptiming/UtcTime.cpp tests/lap_timer_test.cpp -o /tmp/lap-tests
      - run: /tmp/lap-tests
      - run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic src/laptiming/LapTimer.cpp src/laptiming/UtcTime.cpp src/laptiming/CircuitSelector.cpp tests/lap_modules_test.cpp -o /tmp/lap-module-tests
      - run: /tmp/lap-module-tests
      - run: python3 tests/check_circuits.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32-s3-devkitc-1, racesync-xiao-esp32-s3-plus]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -e ${{ matrix.environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware.bin
