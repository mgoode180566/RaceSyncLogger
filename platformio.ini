[env:racesync-xiao-esp32-s3-plus]

platform = espressif32
; XIAO ESP32-S3 Plus uses the ESP32-S3 target. The exact PlatformIO board
; definition will be validated against the installed platform when hardware arrives.
board = seeed_xiao_esp32s3
framework = arduino

extra_scripts = pre:scripts/generate_build_info.py

monitor_speed = 115200
upload_speed = 921600

; USB/COM port is intentionally auto-detected for the XIAO board.\n\nmonitor_dtr = 0
monitor_rts = 0

; Plus hardware has 16 MB flash / 8 MB PSRAM. Validate the selected board
; definition and memory layout on the physical board before race use.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
