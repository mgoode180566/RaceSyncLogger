[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32 @ 6.12.0
framework = arduino
extra_scripts = pre:scripts/generate_build_info.py
monitor_speed = 115200
upload_speed = 921600
; Auto-detect USB ports. Override locally or use pio run --upload-port COM4.
monitor_dtr = 0
monitor_rts = 0
; Both supported units are the 16 MB flash / 8 MB octal PSRAM variants.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D RACESYNC_BOARD_DEVKIT_S3

[env:racesync-xiao-esp32-s3-plus]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D RACESYNC_BOARD_XIAO_S3_PLUS
